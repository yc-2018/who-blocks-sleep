name: dev-build

# 推送到 main 就自动打包 exe，发布为滚动更新的 dev 预发布版。
# 纯文档改动不触发（省 CI 额度）；也可以手动 Run workflow。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: who-blocks-sleep
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # 把 APP_VER 从 "1.0" 改成 "dev+<sha>"，dev 版在标题栏就能看出是哪次构建
      - name: 写入开发版版本号
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $src = Join-Path $env:GITHUB_WORKSPACE 'src/who_blocks_sleep.py'
          $txt = [IO.File]::ReadAllText($src, [Text.Encoding]::UTF8)
          $txt = $txt -replace 'APP_VER = "1\.0"', ('APP_VER = "dev+' + $sha + '"')
          [IO.File]::WriteAllText($src, $txt, (New-Object Text.UTF8Encoding($false)))
          Write-Output "APP_VER = dev+$sha"

      # --specpath 会让 --add-data 的相对路径解析到 spec 目录，所以这里全部用绝对路径
      - name: 打包 exe
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $ico = Join-Path $root 'assets/app.ico'
          $man = Join-Path $root 'assets/app.manifest'
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --manifest $man --icon $ico --add-data "$ico;assets" `
            --name $env:APP_NAME `
            --distpath (Join-Path $root 'dist') `
            --workpath (Join-Path $root 'build') `
            --specpath (Join-Path $root 'build') `
            (Join-Path $root 'src/who_blocks_sleep.py')

      # 关键校验：--uac-admin 和 --manifest 只要少传一个，提权或 DPI 感知就会静默丢失
      - name: 校验清单与产物
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "打包失败：找不到 $exe" }
          $size = (Get-Item $exe).Length
          if ($size -lt 5MB) { throw "产物异常：只有 $size 字节" }
          $raw = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
          if ($raw -notmatch 'requireAdministrator') { throw "清单缺少 requireAdministrator：UAC 提权丢失" }
          if ($raw -notmatch 'dpiAware') { throw "清单缺少 dpiAware：高缩放屏上界面会发虚" }
          Write-Output ("产物 OK：" + [math]::Round($size / 1MB, 2) + " MB，提权与 DPI 声明齐备")

      - name: 生成校验和
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/$env:APP_NAME.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:APP_NAME.exe" | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'dist/SHA256SUMS.txt') -Encoding utf8
          Write-Output $hash

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ github.sha }}
          path: dist/*
          retention-days: 14

      # dev 标签是滚动的：每次先删掉旧 release 和 tag，再在最新提交上重建
      - name: 发布 dev 预发布版
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'dev'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "删除旧的 $tag release"
            gh release delete $tag --yes --cleanup-tag
          }

          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $body = @"
          由 GitHub Actions 自动构建的开发版，**非稳定版本**，可能随时坏掉。

          - 提交：``${sha}``（$env:GITHUB_REF_NAME）
          - 构建时间：$(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC
          - 构建日志：$repo/actions/runs/$env:GITHUB_RUN_ID
          - 稳定版：$repo/releases/latest

          使用方式同正式版：下载 exe 双击运行，启动时点「是」通过 UAC 提权。
          "@
          $body | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'relnotes.md') -Encoding utf8

          gh release create $tag `
            (Join-Path $env:GITHUB_WORKSPACE "dist/$env:APP_NAME.exe") `
            (Join-Path $env:GITHUB_WORKSPACE 'dist/SHA256SUMS.txt') `
            --title "dev 自动构建" `
            --notes-file (Join-Path $env:GITHUB_WORKSPACE 'relnotes.md') `
            --prerelease
